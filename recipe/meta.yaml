{% set python_min = "3.11" %}
{% set name = "bagofholding" %}
{% set version = "0.1.15" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/bagofholding-{{ version }}.tar.gz
  sha256: 0732790e4ab93f037cfbff3180bb0190c5a23be86d6d0c7d1e429161903fc724

build:
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv
  number: 0

requirements:
  host:
    - python {{ python_min }}
    - hatchling ==1.32.4
    - hatch-vcs ==0.5.0
    - pip
  run:
    - python >={{ python_min }},<3.15
    - bidict >=0.23.1,<=0.24.1
    - h5py >=3.12.1,<3.17.0
    - numpy >=1.26.4,<2.6.0
    - pygtrie >=2.5.0,<2.7.0
    - pyiron_snippets >=1.0.0,<2.0.0

test:
  imports:
    - bagofholding
  commands:
    - pip check
  requires:
    - pip
    - python {{ python_min }}

about:
  home: https://github.com/pyiron/bagofholding
  summary: bagofholding - browsable, partially-reloadable serialization for pickleable python objects.
  license: BSD-3-Clause
  license_file: LICENSE

extra:
  recipe-maintainers:
    - liamhuber
    - niklassiemer
